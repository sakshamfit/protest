name: Update and deploy

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min, off the hour (GitHub delays :00 runs the most)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reset:
        description: "Discard cached state and re-fetch the full 7-day window"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # cache save + keepalive (re-enable this workflow)

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pipeline state (bookmark + clusters) lives in the Actions cache, not in git,
      # so the repo doesn't get a commit every 30 minutes. If the cache is ever
      # missing, the script simply backfills the last 7 days (~10 seconds).
      - name: Restore pipeline state
        if: ${{ !inputs.reset }}
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: gdelt-state-${{ github.run_id }}
          restore-keys: gdelt-state-

      - name: Fetch protests from GDELT
        run: node scripts/fetch-gdelt.mjs

      - name: Save pipeline state
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: gdelt-state-${{ github.run_id }}-${{ github.run_attempt }}

      - id: pages
        uses: actions/configure-pages@v6

      # SITE_URL (repo variable) sets the canonical URL for both hosts; defaults to the Pages URL.
      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL || format('{0}/', steps.pages.outputs.base_url) }}
        run: node scripts/build-site.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5

      # Same build, also on Vercel. Skipped until the VERCEL_TOKEN secret exists.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "No VERCEL_TOKEN secret; skipping"; exit 0; fi
          npx --yes vercel@63 deploy _site --prod --yes --token "$VERCEL_TOKEN"

      # GitHub disables scheduled workflows in public repos after 60 days without
      # a commit. Re-enabling once a day resets that clock without any commits.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" && echo "Schedule kept alive"
          fi
